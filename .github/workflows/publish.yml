# Publish viewtron-sdk to npm with trusted publishing (no npm token).
# Runs when a GitHub release is published, or by hand for an existing tag.
name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish, e.g. v1.2.3"
        required: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      # Node 24 ships npm 11.5.1 or newer, which trusted publishing requires.
      # https://docs.npmjs.com/trusted-publishers
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Check npm supports trusted publishing
        run: |
          NPM_VERSION="$(npm --version)"
          echo "npm $NPM_VERSION"
          node -e '
            const parts = process.argv[1].split(".").map(Number);
            const ok = parts[0] > 11 || (parts[0] === 11 && (parts[1] > 5 || (parts[1] === 5 && parts[2] >= 1)));
            if (!ok) {
              console.error("::error::npm " + process.argv[1] + " is older than 11.5.1, which trusted publishing requires");
              process.exit(1);
            }
          ' "$NPM_VERSION"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Check tag matches package.json version
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$TAG' is not in vX.Y.Z form"
            exit 1
          fi
          VERSION="${TAG#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "$VERSION" ]; then
            echo "::error::package.json version $PKG_VERSION does not match tag $TAG (expected $VERSION)"
            exit 1
          fi

      # Provenance is attached automatically for trusted publishing from a public repository.
      - name: Publish to npm
        run: npm publish
